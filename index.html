<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#075d7a"><title>Bella PartsFlow</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f3f7fd;--card:#fff;--tx:#13294b;--mut:#5b6b82;--pri:#075d7a;--ok:#1a8f4c;--bad:#c93636;--warn:#c27a00;--bd:#d6e2f3;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:600px;margin:0 auto;padding-bottom:76px}
header{position:sticky;top:0;background:#fff;border-bottom:3px solid var(--pri);padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));display:flex;gap:8px;align-items:center;z-index:5}
.lg{height:38px;width:auto}header b{flex:1;font-size:13px;letter-spacing:1px;color:var(--mut)}
main{padding:12px}h1{font-size:20px;color:var(--pri);margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid var(--bd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(19,41,75,.06)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.sp{justify-content:space-between}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{text-align:center;cursor:pointer;margin:0}.em{font-size:32px;flex:none;width:44px;text-align:center}.tile .em{width:auto;font-size:34px}
.st{text-align:center;margin:0}.st b{font-size:24px;display:block}.mut{color:var(--mut);font-size:13px}
input,select,textarea{font:inherit;width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:#fff;color:var(--tx)}
label{display:block;margin:10px 0 3px;font-size:13px;color:var(--mut)}
button{font:inherit;border:0;border-radius:8px;padding:10px 14px;min-height:44px;background:var(--pri);color:#fff;font-weight:600;cursor:pointer}
button.o{background:transparent;color:var(--pri);border:1px solid var(--pri)}button.g{background:var(--ok)}button.r{background:var(--bad)}button.w{width:100%}button:disabled{opacity:.45}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;color:#fff;background:var(--mut)}
.pending,.low{background:var(--warn)}.approved{background:var(--pri)}.issued,.in{background:var(--ok)}.rejected,.cancelled,.out{background:var(--bad)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.tabs button{white-space:nowrap;padding:6px 12px;font-size:13px;min-height:36px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:600px;margin:0 auto;background:#fff;border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;font-size:13px}nav button.on{color:var(--pri);border-top:3px solid var(--pri)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.sc{overflow-x:auto}.who{font-size:13px;color:var(--mut);margin-bottom:10px}.who a{color:var(--pri);text-decoration:underline;cursor:pointer}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#13294b;color:#fff;padding:10px 16px;border-radius:8px;z-index:20;max-width:90%;display:none}
.login{padding-top:30px;text-align:center}.login .lg{height:70px;margin-bottom:10px}.login .card{text-align:left}
</style></head><body><div id="toast"></div><div id="app"></div>

const sb=supabase.createClient(SB_URL,KEY);
const T=[["Knob","🔘"],["Plate","▣"],["Flange","⭕"],["Handle Ring","💍"],["Cartridge","⚙️"],["Diverter","🔀"],["Spout","🚰"],["D Cover","🛡️"],["Shower Arm","🚿"],["Shower Bracket","🪝"],["Spare Nozzle","💦"],["Wall Hanging Rod","🪄"],["Angle Valve","🔧"],["Handle","🕹️"],["Other parts","🚽"]];
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const emo=t=>(T.find(x=>x[0]===t)||[0,"🔧"])[1],fmt=d=>d?new Date(d).toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"";
let S={me:null,tab:"parts",type:null,prod:null,P:[],R:[],N:[],X:[],U:[],f:"pending",bell:0};
const adm=()=>S.me&&S.me.role==="admin",low=p=>p.physical_stock<p.min_stock;
function toast(m){const e=$("#toast");e.textContent=m;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",3800)}
function draw(){const a=$("#app"),old={},f=document.activeElement&&document.activeElement.id;
 a.querySelectorAll("input[id],textarea[id],select[id]").forEach(e=>old[e.id]=e.value);
 a.innerHTML=view();
 for(const id in old){const e=document.getElementById(id);if(e&&old[id]!=="")e.value=old[id]}
 if(f){const e=document.getElementById(f);if(e)e.focus()}}
async function login(ev){ev.preventDefault();const u=$("#u").value.trim().toLowerCase(),p=$("#p").value;
 const{error}=await sb.auth.signInWithPassword({email:u.includes("@")?u:u+DOM,password:p});
 if(error)return toast("Wrong username or password");await start()}
async function start(){const{data:{session}}=await sb.auth.getSession();if(!session){S.me=null;return draw()}
 const{data,error}=await sb.from("profiles").select("*").eq("id",session.user.id).single();
 if(error||!data||!data.active){await sb.auth.signOut();S.me=null;draw();return toast("Account not active")}
 S.me=data;S.tab=adm()?"dash":"parts";await load();
 sb.channel("pf").on("postgres_changes",{event:"*",schema:"public"},()=>{clearTimeout(start.t);start.t=setTimeout(load,700)}).subscribe()}
async function logout(){await sb.auth.signOut();location.reload()}
function chpw(){const p=prompt("New password (at least 8 characters)");if(!p)return;if(p.length<8)return toast("Password too short");
 sb.auth.updateUser({password:p}).then(({error})=>toast(error?error.message:"Password changed"))}
async function load(){
 const q=[sb.from("products").select("*").order("group_name").order("name"),sb.from("request_details").select("*").order("created_at",{ascending:false}).limit(300),
 sb.from("notifications").select("*").order("created_at",{ascending:false}).limit(60),sb.from("profiles").select("id,full_name,role,username").eq("active",true).order("full_name")];
 if(adm())q.push(sb.from("stock_transactions").select("id,tx_type,quantity,physical_after,reserved_after,created_at,products(name,code),profiles(full_name)").order("created_at",{ascending:false}).limit(200));
 const r=await Promise.all(q),e=r.find(x=>x.error);if(e)return toast(e.error.message);
 S.P=r[0].data;S.R=r[1].data;S.N=r[2].data;S.U=r[3].data;S.X=r[4]?r[4].data:[];draw()}
async function act(fn,args,ok){const{error}=await sb.rpc(fn,args);if(error)return toast(error.message);await load();toast(ok)}
const appr=id=>act("approve_request",{p_request:id},"Approved, stock reserved");
const rej=id=>{const w=prompt("Reason for rejection (optional)");if(w!==null)act("reject_request",{p_request:id,p_reason:w},"Rejected")};
const canc=id=>{if(confirm("Cancel this request?"))act("cancel_request",{p_request:id},"Cancelled")};
const hand=id=>act("handover_request",{p_request:id,p_collected_by:$("#c"+id).value},"Handover done, stock updated");
function editp(id){const p=S.P.find(x=>x.id===id),a=prompt("Physical stock for "+p.name,p.physical_stock);if(a===null)return;const m=prompt("Minimum stock",p.min_stock);if(m===null)return;
 if(isNaN(+a)||isNaN(+m)||a===""||m==="")return toast("Enter numbers only");act("admin_update_product",{p_product:id,p_physical:+a,p_min:+m,p_location:null},"Stock updated")}
async function send(id){const q=+$("#rq").value,j=$("#rj").value.trim();if(!(q>0))return toast("Enter a valid quantity");if(!j)return toast("Service Job Number is required");
 const{error}=await sb.rpc("create_request",{p_product:id,p_qty:q,p_job:j,p_customer:$("#rc").value||null,p_purpose:$("#rp").value||null});
 if(error)return toast(error.message);S.prod=null;S.type=null;S.tab="mine";await load();toast("Request submitted")}
function bell(){const un=S.N.filter(n=>!n.is_read).map(n=>n.id);S.bell=!S.bell;
 if(!S.bell&&un.length){sb.from("notifications").update({is_read:true}).in("id",un).then(()=>{S.N.forEach(n=>n.is_read=true);draw()})}draw()}
function csv(name,rows){const t=rows.map(r=>r.map(v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"').join(",")).join("\r\n"),a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob(["\ufeff"+t],{type:"text/csv"}));a.download=name+".csv";a.click()}
const expStock=()=>csv("stock",[["Code","Name","Type","Physical","Reserved","Available","Minimum","Rack"],...S.P.map(p=>[p.code,p.name,p.part_type,p.physical_stock,p.reserved_stock,p.available_stock,p.min_stock,p.location])]);
const expLow=()=>csv("purchase_report",[["Code","Name","Physical","Reserved","Available","Minimum","Suggested purchase","Date"],...S.P.filter(low).map(p=>[p.code,p.name,p.physical_stock,p.reserved_stock,p.available_stock,p.min_stock,p.min_stock*2-p.physical_stock,new Date().toLocaleDateString("en-GB")])]);
const expReq=()=>csv("requests",[["No","Status","Part","Code","Qty","Requested by","Job","Approved by","Issued by","Collected by","Created","Issued"],...S.R.map(r=>[r.request_no,r.status,r.product_name,r.product_code,r.quantity,r.requested_by_name,r.job_number,r.approved_by_name,r.issued_by_name,r.collected_by_name,fmt(r.created_at),fmt(r.issued_at)])]);
const chip=p=>p.physical_stock<=0?'<span class="chip out">Out of stock</span>':low(p)?'<span class="chip low">Low stock</span>':'<span class="chip in">In stock</span>';
function vLogin(){return `<div class="login"><img class="lg" src="${LOGO}" alt="Bella"><h1 style="border:0">Right Parts. Right Time.</h1><form class="card" onsubmit="login(event)"><label>Username</label><input id="u" autocapitalize="none" autocomplete="username" placeholder="e.g. suhar"><label>Password</label><input id="p" type="password" autocomplete="current-password"><p><button class="w">Sign in</button></p></form></div>`}
function vParts(){if(S.prod)return vProd();
 if(S.type==null){const c=T.map(t=>[t,S.P.filter(p=>p.part_type===t[0]&&p.active).length]).filter(x=>x[1]);
  return `<h1>Select part type</h1><div class="grid">${c.map(([t,n])=>`<div class="card tile" onclick="S.type='${t[0]}';draw()"><div class="em">${t[1]}</div><b>${t[0]}</b><div class="mut">${n} items</div></div>`).join("")}</div>`}
 const l=S.P.filter(p=>p.part_type===S.type&&p.active);
 return `<button class="o" onclick="S.type=null;draw()">← All types</button><h1 style="margin-top:10px">${emo(S.type)} ${esc(S.type)}</h1><div class="card"><label>Part code and name</label><select id="wq">${l.map(p=>`<option value="${p.id}">${esc((p.code||"NO CODE")+" · "+p.name)}</option>`).join("")}</select><p><button class="w" onclick="S.prod=$('#wq').value;draw()">Continue</button></p></div>`}
function vProd(){const p=S.P.find(x=>x.id===S.prod);if(!p){S.prod=null;return vParts()}
 return `<button class="o" onclick="S.prod=null;draw()">← Back</button><div class="card" style="margin-top:10px"><div class="row"><div class="em">${emo(p.part_type)}</div><div style="flex:4"><b>${esc(p.name)}</b><div class="mut">${esc(p.code||"NO CODE")} · ${esc(p.group_name||"")} · Rack ${esc(p.location||"-")}</div>${chip(p)}</div></div>
 <div class="grid" style="margin-top:10px"><div class="card st">Physical<b>${p.physical_stock}</b></div><div class="card st">Reserved<b>${p.reserved_stock}</b></div><div class="card st">Available<b>${p.available_stock}</b></div><div class="card st">Minimum<b>${p.min_stock}</b></div></div></div>
 <div class="card"><b>Request this part</b><label>Quantity (max ${p.available_stock})</label><input id="rq" type="number" min="1" max="${p.available_stock}" value="1"><label>Service Job Number *</label><input id="rj"><label>Customer / service reference</label><input id="rc"><label>Purpose</label><textarea id="rp" rows="2"></textarea><p><button class="w" ${p.available_stock>0?"":"disabled"} onclick="send('${p.id}')">Submit request</button></p></div>`}
function rCard(r,a){const un=S.U.filter(u=>u.role==="technician");
 return `<div class="card"><div class="row sp"><b>${esc(r.request_no)}</b><span class="chip ${r.status}" style="flex:none">${r.status}</span></div><div>${emo((S.P.find(p=>p.id===r.product_id)||{}).part_type)} ${esc(r.product_name)} × <b>${r.quantity}</b></div>
 <div class="mut">${esc(r.product_code||"NO CODE")} · By ${esc(r.requested_by_name)} · Job ${esc(r.job_number)} · ${fmt(r.created_at)}${r.purpose?"<br>Purpose: "+esc(r.purpose):""}${a?"<br>Available now: "+r.available_stock:""}${r.approved_by_name?"<br>Approved by "+esc(r.approved_by_name):""}${r.reject_reason?"<br>Reason: "+esc(r.reject_reason):""}${r.issued_by_name?"<br>Issued by "+esc(r.issued_by_name)+", collected by "+esc(r.collected_by_name)+" · "+fmt(r.issued_at):""}</div>
 ${a&&r.status==="pending"?`<div class="row" style="margin-top:8px"><button class="g" onclick="appr('${r.id}')">Approve</button><button class="r" onclick="rej('${r.id}')">Reject</button></div>`:""}
 ${a&&r.status==="approved"?`<label>Collected by</label><select id="c${r.id}">${un.map(u=>`<option value="${u.id}" ${u.id===r.requested_by?"selected":""}>${esc(u.full_name)}</option>`).join("")}</select><div class="row" style="margin-top:8px"><button class="g" onclick="hand('${r.id}')">Confirm handover</button><button class="o" onclick="canc('${r.id}')">Cancel</button></div>`:""}
 ${!a&&r.status==="pending"?`<p><button class="o" onclick="canc('${r.id}')">Cancel request</button></p>`:""}</div>`}
const vMine=()=>`<h1>My requests</h1>`+(S.R.length?S.R.map(r=>rCard(r,0)).join(""):'<p class="mut">No requests yet.</p>');
function vDash(){const c=s=>S.R.filter(r=>r.status===s).length,td=new Date().toDateString(),
 s=[["Products",S.P.length],["Total physical",S.P.reduce((a,p)=>a+p.physical_stock,0)],["Pending",c("pending")],["Approved",c("approved")],["Issued today",S.R.filter(r=>r.status==="issued"&&new Date(r.issued_at).toDateString()===td).length],["Low stock",S.P.filter(low).length],["Out of stock",S.P.filter(p=>p.physical_stock<=0).length]];
 return `<h1>Dashboard</h1><div class="grid">${s.map(x=>`<div class="card st">${x[0]}<b>${x[1]}</b></div>`).join("")}</div>`}
function vReq(){const fs=["pending","approved","issued","rejected","cancelled"],l=S.R.filter(r=>r.status===S.f);
 return `<h1>Request management</h1><div class="tabs">${fs.map(f=>`<button class="${S.f===f?"":"o"}" onclick="S.f='${f}';draw()">${f} (${S.R.filter(r=>r.status===f).length})</button>`).join("")}</div>`+(l.length?l.map(r=>rCard(r,1)).join(""):'<p class="mut">Nothing here.</p>')}
function vStock(){const l=S.P.filter(low);
 return `<h1>Stock &amp; purchase report</h1><div class="row" style="margin-bottom:12px"><button class="o" onclick="expLow()">Purchase report (CSV)</button><button class="o" onclick="expStock()">All stock (CSV)</button></div><button class="o w" style="margin-bottom:12px" onclick="expReq()">Backup: all requests (CSV)</button>
 <div class="card"><b>Low stock (${l.length})</b><div class="mut">Suggested purchase = (minimum × 2) − physical</div><div class="sc"><table><tr><th>Part</th><th>Phys</th><th>Res</th><th>Min</th><th>Buy</th></tr>${l.map(p=>`<tr><td>${esc(p.name)}<br><span class="mut">${esc(p.code||"NO CODE")}</span></td><td>${p.physical_stock}</td><td>${p.reserved_stock}</td><td>${p.min_stock}</td><td><b>${p.min_stock*2-p.physical_stock}</b></td></tr>`).join("")}</table></div></div>
 <div class="card"><b>All stock</b><div class="sc"><table><tr><th>Part</th><th>Phys</th><th>Res</th><th>Avail</th><th></th></tr>${S.P.map(p=>`<tr><td>${esc(p.name)}<br><span class="mut">${esc(p.code||"NO CODE")}</span></td><td>${p.physical_stock}</td><td>${p.reserved_stock}</td><td>${p.available_stock}</td><td><button class="o" style="min-height:30px;padding:2px 8px" onclick="editp('${p.id}')">Edit</button></td></tr>`).join("")}</table></div></div>`}
const vLog=()=>`<h1>Stock history</h1>`+(S.X.length?`<div class="card sc"><table><tr><th>When</th><th>Type</th><th>Part</th><th>Qty</th><th>By</th></tr>${S.X.map(t=>`<tr><td>${fmt(t.created_at)}</td><td>${t.tx_type}</td><td>${esc(t.products&&t.products.name)}</td><td>${t.quantity}</td><td>${esc(t.profiles&&t.profiles.full_name)}</td></tr>`).join("")}</table></div>`:'<p class="mut">No movements yet.</p>');
function view(){if(!S.me)return vLogin();const un=S.N.filter(n=>!n.is_read).length,
 tabs=adm()?[["dash","📊 Dashboard"],["req","📋 Requests"],["stock","📦 Stock"],["log","🧾 History"]]:[["parts","🔍 Parts"],["mine","📋 My requests"]],
 v={parts:vParts,mine:vMine,dash:vDash,req:vReq,stock:vStock,log:vLog};
 return `<header><img class="lg" src="${LOGO}" alt="Bella"><b>PARTSFLOW</b><button class="o" onclick="bell()">🔔${un?" "+un:""}</button></header><main><div class="who">${esc(S.me.full_name)} · <a onclick="chpw()">Change password</a> · <a onclick="logout()">Log out</a></div>
 ${S.bell?`<div class="card"><b>Notifications</b>${S.N.length?S.N.map(n=>`<div style="padding:6px 0;border-bottom:1px solid var(--bd);${n.is_read?"":"font-weight:700"}">${esc(n.message)}<div class="mut">${fmt(n.created_at)}</div></div>`).join(""):'<p class="mut">No notifications.</p>'}</div>`:""}
 ${v[S.tab]()}</main><nav>${tabs.map(t=>`<button class="${S.tab===t[0]?"on":""}" onclick="S.tab='${t[0]}';S.type=null;S.prod=null;S.bell=0;draw()">${t[1]}</button>`).join("")}</nav>`}
draw();start();
</script></body></html>
